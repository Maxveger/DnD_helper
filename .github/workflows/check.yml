name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run --frozen ruff check dnd_helper tests scripts
      - run: uv run --frozen pytest -q --junitxml=build/test-results.xml
      - name: Explain test failures
        if: failure()
        run: python scripts/report_test_failures.py build/test-results.xml
      - run: python scripts/ci_command.py uv run --frozen python scripts/smoke.py
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py uv run --frozen python scripts/build.py
      - name: Check frozen Windows application
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py uv run --frozen python scripts/smoke.py --executable dist/DnD-Helper/DnD-Helper.exe
      - name: Install browser for Windows acceptance
        if: runner.os == 'Windows'
        run: uv run --frozen playwright install chromium
      - name: Check imported story in frozen Windows browser UI
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py uv run --frozen python scripts/browser_import_check.py --executable dist/DnD-Helper/DnD-Helper.exe
      - name: Check demo recovery and combat in frozen Windows browser UI
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py uv run --frozen python scripts/browser_gameplay_check.py --executable dist/DnD-Helper/DnD-Helper.exe
      - name: Package source code
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py uv run --frozen python scripts/source_archive.py
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: DnD-Helper-windows-and-source
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/browser-import/*.png
            build/browser-gameplay/*.png
          if-no-files-found: ignore
          retention-days: 7
