name: Publish verified release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-verified-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify the existing build and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_command.py python scripts/publish_release.py .github/release-request.json
