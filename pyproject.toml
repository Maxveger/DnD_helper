[project]
name = "dnd-helper"
version = "0.2.0"
description = "Local live-model IDE for a human tabletop game master"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
dnd-helper = "dnd_helper.launcher:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
